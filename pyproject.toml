[project]
description = "A starter template for marimo notebooks with pixi"
name = "marimo-template"
requires-python = ">=3.10"
version = "0.1.0"

[tool.pixi.workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = [{ platform = "win-64", cuda = "12.8" }]

[tool.pixi.dependencies]
marimo = ">=0.24.2"
cuda-version = "12.8.*"
pytorch-gpu = ">=2.5"
torchvision = "*"
ultralytics = ">=8.4"
opencv = "*"
pillow = "*"

[tool.pixi.tasks]
demo = "marimo edit src/app.py"
object = "python src/object.py"
seg = "python src/seg.py"

[tool.marimo.save]
autosave = "after_delay"
autosave_delay = 1000
format_on_save = false

[tool.marimo.package_management]
manager = "pixi"
